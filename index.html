<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cookbook</title>
  <meta name="description" content="My favourite recipes.">
  <meta name="theme-color" content="#35121C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cookbook">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <script>/* set the theme before first paint so there's no flash */
    try { var t = (JSON.parse(localStorage.getItem('cb.settings.v1')) || {}).theme || 'auto';
      var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#35121C' : '#5E1527'); } catch (e) {}</script>
  <link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>
  </div>

  <div id="timers" aria-live="polite" hidden></div>

  <nav id="tabbar" aria-label="Main">
    <button class="tab" data-tab="home" aria-label="Cookbook">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg>
      <span>Cookbook</span>
    </button>
    <button class="tab" data-tab="search" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span>Search</span>
    </button>
    <button class="tab tab-add" data-tab="add" aria-label="Add a recipe">
      <span class="add-ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <button class="tab" data-tab="grocery" aria-label="Grocery list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h2.2l2 10.2a1.5 1.5 0 0 0 1.5 1.2h7.6a1.5 1.5 0 0 0 1.5-1.1L20 8.5H6.6"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
      <span>Groceries</span>
      <i class="badge" id="grocery-badge" hidden></i>
    </button>
    <button class="tab" data-tab="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:serif;color:#F5E9D6;background:#35121C">Cookbook needs JavaScript to run.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
